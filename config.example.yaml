# token-price-widget example configuration
# Copy to config.yaml and edit for your token(s).

# Hive-Engine node to query
node: "https://engine.hive.pizza"

# How often to record a price snapshot (seconds)
poll_interval: 300

# How many days of snapshots to keep (null = keep forever)
retention_days: 90

# Storage backend
# sqlite:///prices.db  (default, no extra deps)
# postgresql://user:pass@host/dbname
# mongodb://localhost:27017/mydb
# json:///path/to/prices.json
database_url: "sqlite:///prices.db"

# Which currencies to resolve to (one or both)
terminal_currencies:
  - hive
  - usd

# External price source for HIVE/USD
hive_usd_source:
  type: external_api
  url: "https://api.coingecko.com/api/v3/simple/price?ids=hive&vs_currencies=usd"
  path: "hive.usd"

# Token resolution chains
tokens:
  ECOBANK:
    chain:
      # Step 1: get ECOBANK price in HSBIDAO from the LP
      - type: lp
        pair: "HSBIDAO:ECOBANK"
        role: quote          # "quote" = we want price of the right-hand token

      # Step 2: HSBIDAO is soft-pegged to 0.5 HIVE (constant assumption)
      - type: constant
        value: 0.5

      # Step 3: multiply by HIVE/USD (resolved from hive_usd_source above)
      # Omit this step if you only want hive-denominated price
      - type: hive_to_usd

  # Example: token that pairs directly with SWAP.HIVE
  SOMETOKEN:
    chain:
      - type: lp
        pair: "SWAP.HIVE:SOMETOKEN"
        role: quote
      - type: constant
        value: 1.0           # SWAP.HIVE = 1 HIVE exactly
      - type: hive_to_usd

  # Example: two-hop LP chain (TOKEN → BEE → SWAP.HIVE → HIVE → USD)
  MYTOKEN:
    chain:
      - type: lp
        pair: "BEE:MYTOKEN"
        role: quote
      - type: lp
        pair: "SWAP.HIVE:BEE"
        role: quote
      - type: constant
        value: 1.0
      - type: hive_to_usd
