[project]
name = "token-price-widget"
version = "0.1.0"
description = "Composable Hive-Engine token price tracker with configurable resolution chains and embeddable chart"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
mongo = ["pymongo>=4.6"]

[project.scripts]
token-price-widget = "token_price_widget.server:main"
token-price-tracker = "token_price_widget.tracker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
